# Nginx configuration for LogFileAnalyzer
# Serves React SPA on / and proxies /api + /socket.io to Gunicorn

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Logging
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Rate limit zone (optional hardening)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream: Gunicorn running locally
    upstream backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Uncomment if serving over HTTPS:
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # --- Serve React SPA ---
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- Proxy API requests to Flask ---
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for long-running analysis requests
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Allow large file uploads
            client_max_body_size 500M;
        }

        # --- Proxy Socket.IO (WebSocket upgrade) ---
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }
    }
}
